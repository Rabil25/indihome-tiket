<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IndiHome Ticket System – WOK Lampung</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Tahoma,Geneva,sans-serif;background:#0b0f1a}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#0b0f1a}::-webkit-scrollbar-thumb{background:#2d3748;border-radius:3px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect} = React;

// ══════════════════════════════════════════════════════════════
const API_URL = "PASTE_URL_APPS_SCRIPT_DISINI";
// ══════════════════════════════════════════════════════════════

const AREA_LIST = [
  "Bandar Lampung","Metro","Liwa","Kalianda","Gunung Sugih",
  "Sukadana","Kotabumi","Blambangan Umpu","Menggala","Kota Agung",
  "Gedong Tataan","Pringsewu","Mesuji","Panaragan Jaya","Krui"
];

const MASALAH_LIST = [
  "Internet LOS (Indikator Lampu Merah)",
  "Koneksi Lambat dan Putus-Putus",
  "Terhubung Tidak Ada Koneksi",
  "Tagihan Layanan",
  "Ganti Password WiFi",
  "Lainnya"
];

// Masalah yang bisa diselesaikan admin branch sendiri (tanpa wajib eskalasi)
const BISA_BRANCH_RESOLVE = ["Tagihan Layanan","Ganti Password WiFi","Lainnya"];

const PRIORITAS = {Rendah:{color:"#22c55e",bg:"#f0fdf4"},Sedang:{color:"#f59e0b",bg:"#fffbeb"},Tinggi:{color:"#ef4444",bg:"#fef2f2"},Kritis:{color:"#7c3aed",bg:"#faf5ff"}};
const STATUS_CONFIG = {
  baru:      {label:"Baru",       color:"#3b82f6",bg:"#eff6ff",icon:"🆕"},
  diproses:  {label:"Diproses",   color:"#f59e0b",bg:"#fffbeb",icon:"⚙️"},
  dieskalasi:{label:"Dieskalasi", color:"#8b5cf6",bg:"#f5f3ff",icon:"📤"},
  dikerjakan:{label:"Dikerjakan", color:"#f97316",bg:"#fff7ed",icon:"🔧"},
  selesai:   {label:"Selesai",    color:"#22c55e",bg:"#f0fdf4",icon:"✅"},
};

// ── VALIDASI ──────────────────────────────────────────────────
const isValidEmail = (email) => {
  if(!email) return false;
  const re = /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,6}$/;
  if(!re.test(email)) return false;
  const tld = email.split('.').pop().toLowerCase();
  const invalidTlds = ['con','cok','cpm','gmal','gamil','gmil','yaho','yahooo','coml','comm','nett','orgg','con','cob','ney','nte','eml'];
  if(invalidTlds.includes(tld)) return false;
  const domain = email.split('@')[1].toLowerCase();
  // reject jelas salah ketik umum
  const typos = ['gmali.com','gmaill.com','gamil.com','gnail.com','gmaul.com','yhaoo.com','yahooo.com'];
  return !typos.includes(domain);
};
const isValidPhone = (p) => /^[0-9]{9,15}$/.test(p.replace(/[\s\-\+]/g,''));
const isValidNomorInternet = (n) => !n || /^[0-9]+$/.test(n.trim());

// ── API & UTILS ───────────────────────────────────────────────
const api = {
  get:  async(a)    => {try{const r=await fetch(`${API_URL}?action=${a}`);return r.json();}catch(e){return{error:e.message};}},
  post: async(a,d)  => {try{const r=await fetch(API_URL,{method:"POST",body:JSON.stringify({action:a,data:d})});return r.json();}catch(e){return{error:e.message};}},
};
const genId = () => {const d=new Date(),p=n=>String(n).padStart(2,"0");return `IH-${d.getFullYear().toString().slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;};
const fmtDate = iso => iso?new Date(iso).toLocaleString("id-ID",{timeZone:"Asia/Jakarta",day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"-";
const fmtDateShort = iso => iso?new Date(iso).toLocaleString("id-ID",{timeZone:"Asia/Jakarta",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"-";
const lsGet=(k,fb)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};

// ── UI ATOMS ──────────────────────────────────────────────────
const Badge=({status})=>{const c=STATUS_CONFIG[status]||STATUS_CONFIG.baru;return <span style={{background:c.bg,color:c.color,border:`1px solid ${c.color}`,borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>{c.icon} {c.label}</span>;};
const PBadge=({p})=>{const c=PRIORITAS[p]||PRIORITAS.Sedang;return <span style={{background:c.bg,color:c.color,border:`1px solid ${c.color}`,borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:700}}>{p}</span>;};
const RoleBadge=({role})=>{const cfg={branch:{color:"#3b82f6",label:"Admin Branch"},ta:{color:"#f59e0b",label:"Admin TA"},regulator:{color:"#8b5cf6",label:"Regulator"}};const c=cfg[role]||cfg.branch;return <span style={{background:c.color+"22",color:c.color,border:`1px solid ${c.color}`,borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:700}}>{c.label}</span>;};

const Inp=({label,value,onChange,type="text",placeholder="",required=false,rows=0,error=""})=>(
  <div style={{display:"flex",flexDirection:"column",gap:4}}>
    <label style={{fontSize:12,fontWeight:600,color:"#94a3b8",textTransform:"uppercase",letterSpacing:0.5}}>{label}{required&&<span style={{color:"#e2001a"}}> *</span>}</label>
    {rows>0
      ?<textarea rows={rows} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{padding:"10px 13px",borderRadius:8,border:`1.5px solid ${error?"#ef4444":"#2d3748"}`,background:"#1e2535",color:"#e2e8f0",fontSize:14,fontFamily:"inherit",outline:"none",resize:"vertical"}}/>
      :<input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{padding:"10px 13px",borderRadius:8,border:`1.5px solid ${error?"#ef4444":"#2d3748"}`,background:"#1e2535",color:"#e2e8f0",fontSize:14,fontFamily:"inherit",outline:"none"}}/>
    }
    {error&&<span style={{color:"#ef4444",fontSize:11}}>{error}</span>}
  </div>
);

const Sel=({label,value,onChange,options,required=false})=>(
  <div style={{display:"flex",flexDirection:"column",gap:4}}>
    <label style={{fontSize:12,fontWeight:600,color:"#94a3b8",textTransform:"uppercase",letterSpacing:0.5}}>{label}{required&&<span style={{color:"#e2001a"}}> *</span>}</label>
    <select value={value} onChange={e=>onChange(e.target.value)} style={{padding:"10px 13px",borderRadius:8,border:"1.5px solid #2d3748",background:"#1e2535",color:value?"#e2e8f0":"#64748b",fontSize:14,fontFamily:"inherit",outline:"none"}}>
      <option value="">-- Pilih --</option>
      {options.map(o=><option key={o} value={o}>{o}</option>)}
    </select>
  </div>
);

const Btn=({children,onClick,v="primary",disabled=false,sm=false})=>{
  const S={
    primary:{background:"linear-gradient(135deg,#e2001a,#c0001a)",color:"#fff",border:"none"},
    secondary:{background:"transparent",color:"#94a3b8",border:"1.5px solid #2d3748"},
    success:{background:"linear-gradient(135deg,#22c55e,#16a34a)",color:"#fff",border:"none"},
    purple:{background:"linear-gradient(135deg,#8b5cf6,#7c3aed)",color:"#fff",border:"none"},
    danger:{background:"linear-gradient(135deg,#ef4444,#dc2626)",color:"#fff",border:"none"},
    orange:{background:"linear-gradient(135deg,#f97316,#ea580c)",color:"#fff",border:"none"},
  };
  return <button onClick={onClick} disabled={disabled} style={{...S[v],padding:sm?"6px 14px":"10px 20px",borderRadius:8,cursor:disabled?"not-allowed":"pointer",fontWeight:700,fontSize:sm?12:14,fontFamily:"inherit",opacity:disabled?0.6:1,whiteSpace:"nowrap"}}>{children}</button>;
};

const Card=({children,style={}})=><div style={{background:"#151c2c",borderRadius:12,border:"1px solid #1e2a3a",padding:20,...style}}>{children}</div>;
const Spinner=()=>(<div style={{minHeight:"100vh",background:"#0b0f1a",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}><div style={{width:40,height:40,border:"4px solid #1e2a3a",borderTop:"4px solid #e2001a",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/><div style={{color:"#64748b",fontSize:14}}>Memuat data...</div></div>);

// Logo IndiHome (coba load gambar, fallback ke teks)
const Logo=()=>(
  <div style={{display:"inline-flex",alignItems:"center",gap:12,background:"linear-gradient(135deg,#e2001a,#c0001a)",padding:"10px 24px",borderRadius:50}}>
    <img src="./logo-indihome.png" alt="IndiHome"
      style={{height:28,objectFit:"contain"}}
      onError={e=>{e.target.style.display="none";e.target.nextSibling.style.display="flex";}}
    />
    <span style={{display:"none",alignItems:"center",gap:8,color:"#fff",fontWeight:800,fontSize:16}}>
      <span>📡</span> IndiHome
    </span>
  </div>
);

// ══════════════════════════════════════════════════════════════
// CUSTOMER PORTAL
// ══════════════════════════════════════════════════════════════
function CustomerPortal({onSubmit,onGoAdmin}){
  const [f,setF]=useState({namaPlg:"",emailPlg:"",noTelp:"",nomorInternet:"",sto:"",masalah:"",prioritas:"Sedang",deskripsi:""});
  const [errors,setErrors]=useState({});
  const [done,setDone]=useState(null);
  const [loading,setLoading]=useState(false);
  const sf=(k,v)=>setF(p=>({...p,[k]:v}));

  const validate = () => {
    const errs={};
    if(!f.namaPlg.trim()) errs.namaPlg="Nama wajib diisi";
    if(!f.emailPlg.trim()) errs.emailPlg="Email wajib diisi";
    else if(!isValidEmail(f.emailPlg)) errs.emailPlg="Format email tidak valid (contoh: nama@gmail.com)";
    if(!f.noTelp.trim()) errs.noTelp="No. telepon wajib diisi";
    else if(!isValidPhone(f.noTelp)) errs.noTelp="Nomor telepon harus angka, 9-15 digit";
    if(f.nomorInternet && !isValidNomorInternet(f.nomorInternet)) errs.nomorInternet="Nomor internet harus berupa angka";
    if(!f.sto) errs.sto="Area wajib dipilih";
    if(!f.masalah) errs.masalah="Jenis masalah wajib dipilih";
    if(!f.deskripsi.trim()) errs.deskripsi="Deskripsi wajib diisi";
    return errs;
  };

  const submit=async()=>{
    const errs=validate();
    if(Object.keys(errs).length>0){setErrors(errs);return;}
    setLoading(true);setErrors({});
    const t={...f,id:genId(),status:"baru",createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
    const res=await api.post("addTicket",t);
    if(res.success){setDone(t.id);onSubmit(t);}
    else alert("Gagal mengirim: "+(res.error||"Cek koneksi & URL API"));
    setLoading(false);
  };

  if(done) return(
    <div style={{minHeight:"100vh",background:"#0b0f1a",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <Card style={{maxWidth:480,width:"100%",textAlign:"center",padding:40}}>
        <div style={{fontSize:56,marginBottom:16}}>✅</div>
        <h2 style={{color:"#e2e8f0",margin:"0 0 8px",fontSize:22}}>Laporan Terkirim!</h2>
        <p style={{color:"#64748b",marginBottom:20}}>Tim kami akan segera menangani kendala Anda.</p>
        <div style={{background:"#1e2535",borderRadius:10,padding:"14px 20px",marginBottom:20}}>
          <div style={{color:"#64748b",fontSize:12,marginBottom:4}}>Nomor Tiket Anda</div>
          <div style={{color:"#e2001a",fontSize:22,fontWeight:900,letterSpacing:2}}>{done}</div>
        </div>
        <p style={{color:"#64748b",fontSize:13,marginBottom:20}}>Konfirmasi dikirim ke email Anda.</p>
        <Btn onClick={()=>{setDone(null);setF({namaPlg:"",emailPlg:"",noTelp:"",nomorInternet:"",sto:"",masalah:"",prioritas:"Sedang",deskripsi:""});}}>+ Laporan Baru</Btn>
      </Card>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:"#0b0f1a",padding:"24px 16px"}}>
      <div style={{maxWidth:600,margin:"0 auto"}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <Logo/>
          <h1 style={{color:"#e2e8f0",fontSize:24,fontWeight:800,margin:"16px 0 8px"}}>Laporkan Kendala Internet</h1>
          <p style={{color:"#64748b",fontSize:14}}>Isi form berikut dan tim kami akan segera membantu</p>
        </div>
        <Card>
          <div style={{display:"flex",flexDirection:"column",gap:16}}>
            {/* Baris 1: Nama + No Telp */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <Inp label="Nama Lengkap" value={f.namaPlg} onChange={v=>sf("namaPlg",v)} required placeholder="Budi Santoso" error={errors.namaPlg}/>
              <Inp label="No. Telepon" value={f.noTelp} onChange={v=>sf("noTelp",v.replace(/[^0-9\s\-\+]/g,""))} required placeholder="08123456789" error={errors.noTelp}/>
            </div>
            {/* Baris 2: Email + No Internet */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <Inp label="Email" type="email" value={f.emailPlg} onChange={v=>sf("emailPlg",v)} required placeholder="nama@gmail.com" error={errors.emailPlg}/>
              <Inp label="Nomor Internet / Pelanggan" value={f.nomorInternet} onChange={v=>sf("nomorInternet",v.replace(/[^0-9]/g,""))} placeholder="1234567890 (opsional)" error={errors.nomorInternet}/>
            </div>
            {/* Baris 3: Area + Masalah */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
              <Sel label="Area" value={f.sto} onChange={v=>sf("sto",v)} options={AREA_LIST} required/>
              <Sel label="Jenis Masalah" value={f.masalah} onChange={v=>sf("masalah",v)} options={MASALAH_LIST} required/>
            </div>
            {/* Prioritas */}
            <div>
              <label style={{fontSize:12,fontWeight:600,color:"#94a3b8",textTransform:"uppercase",letterSpacing:0.5,display:"block",marginBottom:8}}>Tingkat Urgensi</label>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {Object.keys(PRIORITAS).map(p=>(
                  <button key={p} onClick={()=>sf("prioritas",p)} style={{padding:"7px 18px",borderRadius:20,border:`2px solid ${PRIORITAS[p].color}`,background:f.prioritas===p?PRIORITAS[p].color:"transparent",color:f.prioritas===p?"#fff":PRIORITAS[p].color,cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"inherit"}}>{p}</button>
                ))}
              </div>
            </div>
            {/* Deskripsi */}
            <Inp label="Deskripsi Masalah" value={f.deskripsi} onChange={v=>sf("deskripsi",v)} required rows={4} placeholder="Jelaskan detail kendala yang Anda alami..." error={errors.deskripsi}/>
            <Btn onClick={submit} disabled={loading}>{loading?"⏳ Mengirim...":"🚀 Kirim Laporan"}</Btn>
          </div>
        </Card>
        <p style={{textAlign:"center",color:"#2d3748",fontSize:12,marginTop:20}}>
          Sudah punya akun admin?{" "}
          <button onClick={onGoAdmin} style={{background:"none",border:"none",color:"#e2001a",cursor:"pointer",fontWeight:700,fontSize:12}}>Login Admin →</button>
        </p>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// AUTH PAGE
// ══════════════════════════════════════════════════════════════
function AuthPage({onLogin,onBack}){
  const [tab,setTab]=useState("login");
  const [f,setF]=useState({name:"",email:"",password:"",branch:""});
  const [err,setErr]=useState("");const [msg,setMsg]=useState("");const [loading,setLoading]=useState(false);
  const sf=(k,v)=>setF(p=>({...p,[k]:v}));

  const login=async()=>{
    setLoading(true);setErr("");setMsg("");
    if(!f.email||!f.password){setErr("Isi email dan password");setLoading(false);return;}
    const res=await api.post("login",{email:f.email,password:f.password});
    if(res.error){setErr(res.error);setLoading(false);return;}
    lsSet("ih_session",res.user);onLogin(res.user);setLoading(false);
  };

  const register=async()=>{
    setLoading(true);setErr("");setMsg("");
    if(!f.name||!f.email||!f.password||!f.branch){setErr("Semua field wajib diisi");setLoading(false);return;}
    if(!isValidEmail(f.email)){setErr("Format email tidak valid");setLoading(false);return;}
    const nu={id:"u_"+Date.now(),name:f.name,email:f.email,password:f.password,branch:f.branch,role:"branch",createdAt:new Date().toISOString()};
    const res=await api.post("addUser",nu);
    if(res.error){setErr(res.error);setLoading(false);return;}
    setMsg("✅ Pendaftaran berhasil! Akun Anda menunggu persetujuan Regulator. Notifikasi akan dikirim ke email Anda setelah disetujui.");
    setLoading(false);
  };

  const Tab=({id,lb})=>(<button onClick={()=>{setTab(id);setErr("");setMsg("");}} style={{flex:1,padding:"10px",border:"none",background:tab===id?"#e2001a":"transparent",color:tab===id?"#fff":"#64748b",cursor:"pointer",fontWeight:700,fontSize:14,fontFamily:"inherit",borderRadius:8}}>{lb}</button>);

  return(
    <div style={{minHeight:"100vh",background:"#0b0f1a",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <Card style={{maxWidth:420,width:"100%"}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{marginBottom:12}}><Logo/></div>
          <h2 style={{color:"#e2e8f0",margin:"12px 0 4px",fontSize:20}}>Portal Admin</h2>
          <p style={{color:"#64748b",fontSize:13}}>WOK Lampung</p>
        </div>
        <div style={{display:"flex",background:"#1e2535",borderRadius:10,padding:4,marginBottom:20,gap:4}}>
          <Tab id="login" lb="Login"/><Tab id="register" lb="Daftar"/>
        </div>
        {err&&<div style={{background:"#2d1515",border:"1px solid #ef4444",color:"#ef4444",borderRadius:8,padding:"10px 14px",fontSize:13,marginBottom:16}}>⚠️ {err}</div>}
        {msg&&<div style={{background:"#0d2d1a",border:"1px solid #22c55e",color:"#4ade80",borderRadius:8,padding:"12px 14px",fontSize:13,marginBottom:16,lineHeight:1.5}}>{msg}</div>}
        {!msg&&<div style={{display:"flex",flexDirection:"column",gap:14}}>
          {tab==="register"&&<Inp label="Nama Lengkap" value={f.name} onChange={v=>sf("name",v)} required placeholder="Nama Admin"/>}
          <Inp label="Email" type="email" value={f.email} onChange={v=>sf("email",v)} required placeholder="admin@indihome.id"/>
          <Inp label="Password" type="password" value={f.password} onChange={v=>sf("password",v)} required placeholder="••••••••"/>
          {tab==="register"&&<Sel label="Branch / Area" value={f.branch} onChange={v=>sf("branch",v)} options={AREA_LIST} required/>}
          <Btn onClick={tab==="login"?login:register} disabled={loading}>{loading?"⏳ Memproses...":tab==="login"?"🔑 Login":"✅ Daftar"}</Btn>
        </div>}
        {tab==="login"&&!msg&&<div style={{marginTop:12,padding:"10px 14px",background:"#1e2535",borderRadius:8,fontSize:12,color:"#64748b"}}>
          <strong style={{color:"#94a3b8"}}>Admin TA:</strong> admin.ta@indihome.id / admin123<br/>
          <strong style={{color:"#94a3b8"}}>Regulator:</strong> lampurajuara@gmail.com / lampura123
        </div>}
        <button onClick={onBack} style={{width:"100%",background:"none",border:"none",color:"#64748b",cursor:"pointer",fontSize:13,marginTop:16,padding:8}}>← Kembali ke Portal Pelanggan</button>
      </Card>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// TICKET MODAL
// ══════════════════════════════════════════════════════════════
function TicketModal({ticket,user,onClose,onUpdate}){
  const [tiketTelkomsel,setTiketTelkomsel]=useState(ticket.tiketTelkomsel||"");
  const [teknisi,setTeknisi]=useState(ticket.teknisi||"");
  const [catatan,setCatatan]=useState(ticket.catatanTA||"");
  const [loading,setLoading]=useState(false);

  const upd=async(patch)=>{
    setLoading(true);
    const updated={...ticket,...patch,updatedAt:new Date().toISOString()};
    const res=await api.post("updateTicket",updated);
    if(res.success)onUpdate(updated);else alert("Gagal: "+(res.error||""));
    setLoading(false);
  };

  // Branch selesaikan sendiri
  const branchSelesai=async()=>{
    setLoading(true);
    const updated={...ticket,status:"selesai",tiketTelkomsel,resolvedAt:new Date().toISOString(),updatedAt:new Date().toISOString(),adminBranch:user.id};
    const res=await api.post("updateTicket",updated);
    if(res.success)onUpdate(updated);else alert("Gagal: "+(res.error||""));
    setLoading(false);
  };

  // TA selesaikan
  const taSelesai=async()=>{
    setLoading(true);
    const updated={...ticket,status:"selesai",teknisi,catatanTA:catatan,tiketTelkomsel,resolvedAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
    const res=await api.post("updateTicket",updated);
    if(res.success)onUpdate(updated);else alert("Gagal: "+(res.error||""));
    setLoading(false);
  };

  const isBranch = user.role==="branch";
  const isTA     = user.role==="ta";
  const canProcess  = isBranch && ticket.status==="baru";
  const canAct      = isBranch && ticket.status==="diproses"; // selesai sendiri / eskalasi
  const canWork     = isTA && ticket.status==="dieskalasi";
  const canFinish   = isTA && ticket.status==="dikerjakan";

  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#151c2c",borderRadius:16,border:"1px solid #1e2a3a",width:"100%",maxWidth:640,maxHeight:"92vh",overflow:"auto"}}>
        {/* Header */}
        <div style={{background:"linear-gradient(135deg,#e2001a,#c0001a)",padding:"16px 20px",borderRadius:"16px 16px 0 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{color:"#fff",fontWeight:800,fontFamily:"monospace",fontSize:16}}>{ticket.id}</div>
            <div style={{color:"#ffd0d0",fontSize:12}}>{fmtDate(ticket.createdAt)}</div>
          </div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,0.2)",border:"none",color:"#fff",width:32,height:32,borderRadius:8,cursor:"pointer",fontSize:18,fontWeight:700}}>×</button>
        </div>

        <div style={{padding:20,display:"flex",flexDirection:"column",gap:14}}>
          {/* Info grid */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {[["👤 Pelanggan",ticket.namaPlg],["📞 Telepon",ticket.noTelp],["📧 Email",ticket.emailPlg],["🔌 No. Internet",ticket.nomorInternet||"-"],["🗺️ Area",ticket.sto],["🔧 Masalah",ticket.masalah]].map(([k,v])=>(
              <div key={k} style={{background:"#1e2535",borderRadius:8,padding:"10px 14px"}}>
                <div style={{color:"#64748b",fontSize:11,marginBottom:4}}>{k}</div>
                <div style={{color:"#e2e8f0",fontSize:13,fontWeight:600}}>{v}</div>
              </div>
            ))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div style={{background:"#1e2535",borderRadius:8,padding:"10px 14px"}}><div style={{color:"#64748b",fontSize:11,marginBottom:6}}>⚡ Prioritas</div><PBadge p={ticket.prioritas}/></div>
            <div style={{background:"#1e2535",borderRadius:8,padding:"10px 14px"}}><div style={{color:"#64748b",fontSize:11,marginBottom:6}}>📊 Status</div><Badge status={ticket.status}/></div>
          </div>

          {/* Deskripsi */}
          <div style={{background:"#1e2535",borderRadius:8,padding:"12px 14px"}}>
            <div style={{color:"#64748b",fontSize:11,marginBottom:6}}>📝 DESKRIPSI</div>
            <div style={{color:"#e2e8f0",fontSize:14,lineHeight:1.6}}>{ticket.deskripsi}</div>
          </div>

          {/* No Tiket Telkomsel — branch bisa isi */}
          {isBranch && ["baru","diproses"].includes(ticket.status) && (
            <Inp label="No. Tiket Telkomsel (opsional)" value={tiketTelkomsel} onChange={setTiketTelkomsel} placeholder="Cth: 1-123456789"/>
          )}
          {ticket.tiketTelkomsel && (
            <div style={{background:"#1e2535",borderRadius:8,padding:"10px 14px",display:"flex",alignItems:"center",gap:10}}>
              <span style={{fontSize:16}}>📌</span>
              <div><div style={{color:"#64748b",fontSize:11}}>NO. TIKET TELKOMSEL</div><div style={{color:"#f59e0b",fontSize:14,fontWeight:700,fontFamily:"monospace"}}>{ticket.tiketTelkomsel}</div></div>
            </div>
          )}

          {/* TA: input teknisi & catatan */}
          {isTA && ["dieskalasi","dikerjakan"].includes(ticket.status) && (
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <Inp label="Nama Teknisi" value={teknisi} onChange={setTeknisi} placeholder="Nama / Tim teknisi"/>
              <Inp label="Catatan Penanganan" value={catatan} onChange={setCatatan} rows={3} placeholder="Tindakan yang dilakukan, hasil pengecekan..."/>
            </div>
          )}

          {/* Tampilkan info teknisi ke branch */}
          {ticket.teknisi && isBranch && (
            <div style={{background:"#1e2535",borderRadius:8,padding:"12px 14px"}}>
              <div style={{color:"#64748b",fontSize:11,marginBottom:6}}>👷 TEKNISI & CATATAN TA</div>
              <div style={{color:"#e2e8f0",fontSize:14}}>{ticket.teknisi}</div>
              {ticket.catatanTA&&<div style={{color:"#94a3b8",fontSize:13,marginTop:6}}>{ticket.catatanTA}</div>}
            </div>
          )}

          {/* ACTION BUTTONS */}
          <div style={{display:"flex",gap:10,flexWrap:"wrap",paddingTop:4}}>
            {/* Branch: Proses tiket baru */}
            {canProcess && <Btn onClick={()=>upd({status:"diproses",tiketTelkomsel,adminBranch:user.id})} disabled={loading} v="secondary">⚙️ Proses Tiket</Btn>}

            {/* Branch: Selesaikan sendiri ATAU eskalasi ke TA */}
            {canAct && <>
              <Btn onClick={branchSelesai} disabled={loading} v="success">✅ Selesaikan & Email Pelanggan</Btn>
              <Btn onClick={()=>upd({status:"dieskalasi",tiketTelkomsel})} disabled={loading} v="purple">📤 Eskalasi ke TA</Btn>
            </>}

            {/* TA: Assign teknisi */}
            {canWork && <Btn onClick={()=>upd({status:"dikerjakan",teknisi,catatanTA:catatan})} disabled={loading} v="orange">🔧 Assign & Kerjakan</Btn>}

            {/* TA: Selesai */}
            {canFinish && <Btn onClick={taSelesai} disabled={loading} v="success">✅ Selesai & Email Pelanggan</Btn>}
          </div>
        </div>
      </div>
    </div>
  );
}

// REGULATOR: KELOLA ADMIN
// ══════════════════════════════════════════════════════════════
function KelolAdmin({users,setUsers}){
  const [loading,setLoading]=useState({});
  const pending  = users.filter(u=>u.status==="pending");
  const approved = users.filter(u=>u.status==="active"&&u.role==="branch");
  const rejected = users.filter(u=>u.status==="rejected");

  const action=async(userId,act)=>{
    setLoading(p=>({...p,[userId]:true}));
    const res=await api.post(act==="approve"?"approveUser":"rejectUser",{userId});
    if(res.success) setUsers(p=>p.map(u=>u.id===userId?{...u,status:act==="approve"?"active":"rejected"}:u));
    else alert("Gagal: "+(res.error||""));
    setLoading(p=>({...p,[userId]:false}));
  };

  const Section=({title,list,showActions})=>(
    <div style={{marginBottom:24}}>
      <h3 style={{color:"#94a3b8",fontSize:13,fontWeight:700,textTransform:"uppercase",letterSpacing:0.5,marginBottom:12}}>{title} ({list.length})</h3>
      {list.length===0?<div style={{color:"#2d3748",fontSize:13,padding:"8px 0"}}>Tidak ada</div>:list.map(u=>(
        <div key={u.id} style={{background:"#1e2535",borderRadius:10,padding:"14px 16px",marginBottom:8,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
          <div>
            <div style={{color:"#e2e8f0",fontWeight:600,fontSize:14}}>{u.name}</div>
            <div style={{color:"#64748b",fontSize:12,marginTop:2}}>{u.email} · {u.branch}</div>
            <div style={{marginTop:6}}><RoleBadge role={u.role}/></div>
          </div>
          {showActions&&<div style={{display:"flex",gap:8}}>
            <Btn onClick={()=>action(u.id,"approve")} disabled={loading[u.id]} v="success" sm>✅ Setujui</Btn>
            <Btn onClick={()=>action(u.id,"reject")}  disabled={loading[u.id]} v="danger"  sm>❌ Tolak</Btn>
          </div>}
        </div>
      ))}
    </div>
  );

  return(
    <div>
      <h2 style={{color:"#e2e8f0",margin:"0 0 24px",fontSize:20}}>👥 Kelola Admin Branch</h2>
      <Section title="⏳ Menunggu Persetujuan" list={pending} showActions={true}/>
      <Section title="✅ Sudah Disetujui"      list={approved} showActions={false}/>
      <Section title="❌ Ditolak"              list={rejected} showActions={false}/>
    </div>
  );
}

// DASHBOARD
// ══════════════════════════════════════════════════════════════
function Dashboard({user,tickets,setTickets,onLogout}){
  const [view,setView]=useState(user.role==="regulator"?"admin":"tickets");
  const [sel,setSel]=useState(null);
  const [filter,setFilter]=useState("all");
  const [search,setSearch]=useState("");
  const [refreshing,setRefreshing]=useState(false);
  const [users,setUsers]=useState([]);

  useEffect(()=>{
    if(user.role==="regulator") api.get("getUsers").then(d=>{if(Array.isArray(d))setUsers(d);});
  },[]);

  const refresh=async()=>{setRefreshing(true);const d=await api.get("getTickets");if(Array.isArray(d))setTickets(d);setRefreshing(false);};
  const myT=user.role==="ta"?tickets.filter(t=>["dieskalasi","dikerjakan","selesai"].includes(t.status)):tickets;
  const filtered=myT.filter(t=>{
    const mf=filter==="all"||t.status===filter;
    const ms=!search||[t.id,t.namaPlg,t.masalah,t.sto,t.tiketTelkomsel,t.nomorInternet].some(v=>String(v||"").toLowerCase().includes(search.toLowerCase()));
    return mf&&ms;
  }).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

  const stats={total:myT.length,baru:myT.filter(t=>t.status==="baru").length,diproses:myT.filter(t=>t.status==="diproses").length,dieskalasi:myT.filter(t=>t.status==="dieskalasi").length,dikerjakan:myT.filter(t=>t.status==="dikerjakan").length,selesai:myT.filter(t=>t.status==="selesai").length};
  const pendingCount=users.filter(u=>u.status==="pending").length;
  const updateTicket=(u)=>{setTickets(p=>p.map(t=>t.id===u.id?u:t));setSel(u);};
  const roleColor={branch:"#3b82f6",ta:"#f59e0b",regulator:"#8b5cf6"};

  const NavBtn=({id,ic,lb,badge=0})=>(
    <button onClick={()=>setView(id)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 16px",margin:"2px 8px",background:view===id?"rgba(226,0,26,0.15)":"none",border:view===id?"1px solid rgba(226,0,26,0.3)":"1px solid transparent",borderRadius:8,color:view===id?"#e2001a":"#64748b",cursor:"pointer",fontWeight:600,fontSize:13,fontFamily:"inherit"}}>
      <span style={{display:"flex",alignItems:"center",gap:10}}>{ic} {lb}</span>
      {badge>0&&<span style={{background:"#e2001a",color:"#fff",borderRadius:10,padding:"1px 7px",fontSize:10,fontWeight:700}}>{badge}</span>}
    </button>
  );

  return(
    <div style={{minHeight:"100vh",background:"#0b0f1a",display:"flex"}}>
      {/* Sidebar */}
      <div style={{width:230,background:"#0f1520",borderRight:"1px solid #1e2a3a",display:"flex",flexDirection:"column",padding:"20px 0",flexShrink:0}}>
        <div style={{padding:"0 16px 16px",borderBottom:"1px solid #1e2a3a",marginBottom:12,textAlign:"center"}}>
          <Logo/>
          <div style={{color:"#64748b",fontSize:10,marginTop:8}}>Ticket Management · WOK Lampung</div>
        </div>
        {user.role!=="regulator"&&<NavBtn id="tickets" ic="🎫" lb="Tiket"/>}
        {user.role!=="regulator"&&<NavBtn id="stats"   ic="📊" lb="Statistik"/>}
        {user.role==="regulator"&&<NavBtn id="admin"   ic="👥" lb="Kelola Admin" badge={pendingCount}/>}
        <div style={{flex:1}}/>
        <div style={{padding:16,borderTop:"1px solid #1e2a3a"}}>
          <div style={{background:"#1e2535",borderRadius:8,padding:12,marginBottom:10}}>
            <div style={{color:"#e2e8f0",fontWeight:600,fontSize:13,marginBottom:2}}>{user.name}</div>
            <div style={{color:roleColor[user.role]||"#e2001a",fontSize:11,fontWeight:700,textTransform:"uppercase"}}>{user.role==="ta"?"Admin TA":user.role==="regulator"?"Regulator":"Admin Branch"}</div>
            <div style={{color:"#64748b",fontSize:11}}>{user.branch}</div>
          </div>
          <button onClick={onLogout} style={{width:"100%",padding:"8px",background:"none",border:"1px solid #2d3748",borderRadius:8,color:"#64748b",cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>↩ Logout</button>
        </div>
      </div>

      {/* Main Content */}
      <div style={{flex:1,overflow:"auto",padding:24}}>
        {view==="admin"&&user.role==="regulator"&&<KelolAdmin users={users} setUsers={setUsers}/>}

        {view==="stats"&&(
          <div>
            <h2 style={{color:"#e2e8f0",margin:"0 0 20px",fontSize:20}}>📊 Statistik Tiket</h2>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12,marginBottom:24}}>
              {[["Total",stats.total,"#e2e8f0"],["Baru",stats.baru,"#3b82f6"],["Diproses",stats.diproses,"#f59e0b"],["Dieskalasi",stats.dieskalasi,"#8b5cf6"],["Dikerjakan",stats.dikerjakan,"#f97316"],["Selesai",stats.selesai,"#22c55e"]].map(([l,v,c])=>(
                <div key={l} style={{background:"#151c2c",borderRadius:10,border:"1px solid #1e2a3a",padding:"14px 18px"}}>
                  <div style={{color:"#64748b",fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:0.5,marginBottom:6}}>{l}</div>
                  <div style={{color:c,fontSize:28,fontWeight:900}}>{v}</div>
                </div>
              ))}
            </div>
            <Card><div style={{color:"#94a3b8",fontSize:14}}>Tingkat penyelesaian: <strong style={{color:"#22c55e",fontSize:20}}>{stats.total?Math.round(stats.selesai/stats.total*100):0}%</strong></div></Card>
          </div>
        )}

        {view==="tickets"&&(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:12}}>
              <h2 style={{color:"#e2e8f0",margin:0,fontSize:20}}>
                🎫 {user.role==="ta"?"Tiket Eskalasi":"Semua Tiket"}
                <span style={{color:"#64748b",fontSize:14,fontWeight:400,marginLeft:8}}>({filtered.length})</span>
              </h2>
              <div style={{display:"flex",gap:10,alignItems:"center"}}>
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Cari tiket, nama, no. internet..." style={{padding:"9px 14px",borderRadius:8,border:"1.5px solid #2d3748",background:"#1e2535",color:"#e2e8f0",fontSize:13,fontFamily:"inherit",outline:"none",width:250}}/>
                <Btn onClick={refresh} disabled={refreshing} v="secondary" sm>{refreshing?"⏳":"🔄"} Refresh</Btn>
              </div>
            </div>

            {/* Filter tabs */}
            <div style={{display:"flex",gap:6,marginBottom:16,flexWrap:"wrap"}}>
              {[["all","Semua",stats.total],...Object.entries(STATUS_CONFIG).map(([k,v])=>[k,v.label,stats[k]||0])].map(([k,l,n])=>(
                <button key={k} onClick={()=>setFilter(k)} style={{padding:"6px 14px",borderRadius:20,border:`1.5px solid ${filter===k?"#e2001a":"#2d3748"}`,background:filter===k?"rgba(226,0,26,0.15)":"transparent",color:filter===k?"#e2001a":"#64748b",cursor:"pointer",fontWeight:600,fontSize:12,fontFamily:"inherit"}}>
                  {l} <span style={{background:"#1e2535",borderRadius:10,padding:"1px 6px",fontSize:10,marginLeft:4}}>{n}</span>
                </button>
              ))}
            </div>

            {/* Table header */}
            <div style={{display:"grid",gridTemplateColumns:"120px 1fr 90px 80px 80px 110px 70px",gap:10,padding:"8px 16px",marginBottom:4}}>
              {["ID TIKET","PELANGGAN / MASALAH","AREA","PRIORITAS","STATUS","TKT TELKOMSEL","MASUK"].map(h=>(
                <div key={h} style={{color:"#64748b",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:0.5}}>{h}</div>
              ))}
            </div>

            {filtered.length===0
              ?<div style={{textAlign:"center",padding:40,color:"#64748b"}}>Tidak ada tiket</div>
              :filtered.map(t=>(
                <div key={t.id} onClick={()=>setSel(t)}
                  style={{display:"grid",gridTemplateColumns:"120px 1fr 90px 80px 80px 110px 70px",gap:10,alignItems:"center",padding:"12px 16px",borderRadius:8,border:"1px solid #1e2a3a",background:"#151c2c",cursor:"pointer",marginBottom:6,transition:"border 0.15s"}}
                  onMouseEnter={e=>e.currentTarget.style.borderColor="#e2001a"}
                  onMouseLeave={e=>e.currentTarget.style.borderColor="#1e2a3a"}>
                  <div style={{fontFamily:"monospace",fontSize:11,color:"#e2001a",fontWeight:700}}>{t.id}</div>
                  <div>
                    <div style={{color:"#e2e8f0",fontSize:13,fontWeight:600}}>{t.namaPlg}</div>
                    <div style={{color:"#64748b",fontSize:11}}>{t.masalah}</div>
                    {t.nomorInternet&&<div style={{color:"#3b82f6",fontSize:10,marginTop:2}}>🔌 {t.nomorInternet}</div>}
                  </div>
                  <div style={{color:"#94a3b8",fontSize:11}}>{t.sto}</div>
                  <PBadge p={t.prioritas}/>
                  <Badge status={t.status}/>
                  <div style={{fontFamily:"monospace",fontSize:11,color:t.tiketTelkomsel?"#f59e0b":"#2d3748"}}>{t.tiketTelkomsel||"—"}</div>
                  <div style={{color:"#64748b",fontSize:10}}>{fmtDateShort(t.createdAt)}</div>
                </div>
              ))
            }
          </div>
        )}
      </div>

      {sel&&<TicketModal ticket={sel} user={user} onClose={()=>setSel(null)} onUpdate={updateTicket}/>}
    </div>
  );
}

// ROOT
function App(){
  const [page,setPage]=useState("loading");
  const [user,setUser]=useState(null);
  const [tickets,setTickets]=useState([]);

  useEffect(()=>{
    const session=lsGet("ih_session",null);
    if(session?.id){
      setUser(session);
      api.get("getTickets").then(d=>{if(Array.isArray(d))setTickets(d);setPage("dashboard");});
    } else setPage("customer");
  },[]);

  const handleLogin=async(u)=>{setUser(u);const d=await api.get("getTickets");if(Array.isArray(d))setTickets(d);setPage("dashboard");};
  const logout=()=>{localStorage.removeItem("ih_session");setUser(null);setTickets([]);setPage("customer");};

  if(page==="loading") return <Spinner/>;
  if(page==="auth")    return <AuthPage onLogin={handleLogin} onBack={()=>setPage("customer")}/>;
  if(page==="dashboard"&&user) return <Dashboard user={user} tickets={tickets} setTickets={setTickets} onLogout={logout}/>;
  return <CustomerPortal onSubmit={t=>setTickets(p=>[...p,t])} onGoAdmin={()=>setPage("auth")}/>;
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
